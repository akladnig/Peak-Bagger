services:
  gateway:
    image: node:20-bookworm-slim
    working_dir: /workspace
    command: ["node", "server/app.mjs"]
    environment:
      PORT: "8080"
      LOCAL_TOPO_STATIC_TILE_ROOT: "${LOCAL_TOPO_STATIC_TILE_ROOT:-}"
      TILESERVER_INTERNAL_URL: "http://tileserver:8080"
      TILESERVER_DATASET_ID: "${TILESERVER_DATASET_ID:-tasmania-local-topo-smoke}"
      TILESERVER_STYLE_ID: "${TILESERVER_STYLE_ID:-}"
      TILESERVER_TILE_SCALE: "${TILESERVER_TILE_SCALE:-}"
    volumes:
      - .:/workspace
    ports:
      - "${LOCAL_TOPO_PORT:-8090}:8080"
    depends_on:
      - tileserver

  tileserver:
    image: maptiler/tileserver-gl:latest
    working_dir: /data
    command:
      - "-c"
      - "/data/config/tileserver-config.json"
      - "--ignore-missing-files"
      - "--verbose"
      - "1"
    volumes:
      - .:/data

  postgis:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    environment:
      POSTGRES_DB: "${LOCAL_TOPO_PREVIEW_DB_NAME:-local_topo_preview}"
      POSTGRES_PASSWORD: "${LOCAL_TOPO_PREVIEW_DB_PASSWORD:-postgres}"
      POSTGRES_USER: "${LOCAL_TOPO_PREVIEW_DB_USER:-postgres}"
    volumes:
      - postgis-data:/var/lib/postgresql/data
      - .:/workspace
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${LOCAL_TOPO_PREVIEW_DB_USER:-postgres} -d ${LOCAL_TOPO_PREVIEW_DB_NAME:-local_topo_preview}
      interval: 5s
      timeout: 5s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:latest
    command:
      - "--config"
      - "/workspace/config/martin-preview.yaml"
    environment:
      LOCAL_TOPO_PREVIEW_DATABASE_URL: "${LOCAL_TOPO_PREVIEW_DATABASE_URL:-postgresql://postgres:postgres@postgis:5432/local_topo_preview}"
      LOCAL_TOPO_PREVIEW_SCHEMA: "local_topo_preview_active"
    volumes:
      - .:/workspace
    depends_on:
      postgis:
        condition: service_healthy

volumes:
  postgis-data:
